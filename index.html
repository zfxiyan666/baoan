<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="浙江保安模拟考试">
<meta name="description" content="浙江省保安员从业资格考试模拟题库，随机抽题组卷，60 分及格，手机电脑通用。">
<title>浙江保安模拟考试</title>
<style>
:root{
  --bg:#f3f5fa;
  --card:#ffffff;
  --ink:#0f172a;
  --ink2:#64748b;
  --ink3:#94a3b8;
  --line:#e7ebf3;
  --brand:#2563eb;
  --brand2:#06b6d4;
  --ok:#12b76a;
  --bad:#f04438;
  --warn:#f79009;
  --r:18px;
  --shadow:0 10px 30px -14px rgba(15,23,42,.28), 0 2px 8px -4px rgba(15,23,42,.08);
  --shadow-sm:0 2px 10px -4px rgba(15,23,42,.14);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080d1a; --card:#131a2b; --ink:#eef2ff; --ink2:#93a1bd; --ink3:#64748b;
    --line:#222c44; --shadow:0 12px 30px -14px rgba(0,0,0,.8), 0 2px 8px -4px rgba(0,0,0,.5);
    --shadow-sm:0 2px 10px -4px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(620px 320px at 8% -8%, rgba(37,99,235,.16), transparent 62%),
    radial-gradient(520px 280px at 100% 2%, rgba(6,182,212,.14), transparent 60%);
}
@media (prefers-color-scheme:dark){
  body::before{background:
    radial-gradient(620px 320px at 8% -8%, rgba(37,99,235,.22), transparent 62%),
    radial-gradient(520px 280px at 100% 2%, rgba(6,182,212,.12), transparent 60%);}
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input{font:inherit}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom))}
.app.has-bar{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.hidden{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.logo{
  width:42px;height:42px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 18px -8px rgba(37,99,235,.9);
}
.brandtext h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.brandtext p{margin:1px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 16px;color:#fff;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 42%,#0891b2 100%);
  box-shadow:0 18px 36px -20px rgba(29,78,216,.95);
}
.hero::after{
  content:"";position:absolute;width:200px;height:200px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%);
}
.hero-top{display:flex;gap:8px;position:relative}
.pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);letter-spacing:.02em}
.pill.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
.hero-main{display:flex;align-items:flex-end;gap:10px;margin:14px 0 2px;position:relative}
.big{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bigcap{font-size:12.5px;line-height:1.35;opacity:.9;padding-bottom:3px}
.hero-stats{display:flex;gap:10px;margin-top:16px;position:relative}
.hero-stats > div{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 10px;backdrop-filter:blur(4px)}
.hero-stats b{display:block;font-size:18px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:11px;opacity:.85}

/* ---------- 模式卡 ---------- */
.sectitle{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sectitle h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink2)}
.sectitle span{font-size:12px;color:var(--ink3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{
  position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 14px;box-shadow:var(--shadow-sm);transition:transform .16s ease, box-shadow .16s ease;
  display:flex;flex-direction:column;gap:8px;min-height:112px;
}
.mode:active{transform:scale(.975)}
.mode.primary{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;min-height:0;padding:16px}
.mode.primary .mic{background:linear-gradient(135deg,#2563eb,#06b6d4);border-color:transparent}
.mode.primary .mic svg{stroke:#fff}
.mic{width:38px;height:38px;border-radius:12px;background:rgba(37,99,235,.09);border:1px solid rgba(37,99,235,.16);display:flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:19px;height:19px;stroke:var(--brand);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mt{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ms{font-size:12px;color:var(--ink2);margin-top:1px}
.tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);padding:2px 8px;border-radius:999px}

/* ---------- 通用卡片 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}

/* ---------- 考试 ---------- */
.exambar{position:sticky;top:0;z-index:15;background:linear-gradient(to bottom,var(--bg) 72%,rgba(243,245,250,0));padding:8px 0 8px;margin:-6px 0 6px}
@media (prefers-color-scheme:dark){.exambar{background:linear-gradient(to bottom,var(--bg) 72%,rgba(8,13,26,0))}}
.exambar-row{display:flex;align-items:center;gap:10px}
.qcount{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.timer{
  margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
  font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);
  padding:5px 12px;border-radius:999px;box-shadow:var(--shadow-sm)
}
.timer svg{width:14px;height:14px;stroke:var(--ink2);fill:none;stroke-width:1.9;stroke-linecap:round}
.timer.low{color:#fff;background:linear-gradient(135deg,#f04438,#fb7185);border-color:transparent}
.timer.low svg{stroke:#fff}
.progress{height:5px;border-radius:999px;background:rgba(148,163,184,.25);margin-top:9px;overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#2563eb,#06b6d4);transition:width .3s ease}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(37,99,235,.1);color:#2563eb}
.badge.multi{background:rgba(245,158,11,.13);color:#d97706}
.badge.tf{background:rgba(18,183,106,.12);color:#0e9f6e}
@media (prefers-color-scheme:dark){
  .badge{background:rgba(96,165,250,.16);color:#93c5fd}
  .badge.multi{background:rgba(245,158,11,.16);color:#fbbf24}
  .badge.tf{background:rgba(18,183,106,.16);color:#34d399}
}
.qtext{margin:10px 0 4px;font-size:17px;line-height:1.65;font-weight:600;letter-spacing:-.01em;word-break:break-word}
.hint{font-size:12px;color:var(--ink3);margin-top:2px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;
  transition:border-color .15s,background .15s,transform .1s;line-height:1.55;
}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink2);
  transition:.15s;margin-top:1px
}
.opt .t{font-size:14.5px;word-break:break-word}
.opt.on{border-color:var(--brand);background:rgba(37,99,235,.06)}
.opt.on .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.ok{border-color:#12b76a;background:rgba(18,183,106,.08)}
.opt.ok .k{background:#12b76a;border-color:#12b76a;color:#fff}
.opt.bad{border-color:#f04438;background:rgba(240,68,56,.07)}
.opt.bad .k{background:#f04438;border-color:#f04438;color:#fff}
.opt .mark{margin-left:auto;font-size:15px;font-weight:700;flex:none}
.opt.ok .mark{color:#12b76a}
.opt.bad .mark{color:#f04438}
.opt:disabled{cursor:default}
.tfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tfgrid .opt{justify-content:center;align-items:center;padding:18px 12px;font-size:16px}
.tfgrid .opt .t{font-size:16px;font-weight:700}
.tfgrid .opt .k{display:none}

/* ---------- 底部操作栏 ---------- */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20}
.actionbar-inner{
  max-width:760px;margin:0 auto;display:flex;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
}
@media (prefers-color-scheme:dark){.actionbar-inner{background:rgba(15,21,36,.9)}}
.btn{
  flex:1;height:48px;border-radius:14px;font-size:15px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:6px;transition:transform .12s,opacity .15s
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.42}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2563eb,#06b6d4);box-shadow:0 10px 22px -12px rgba(37,99,235,.95)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{flex:none;padding:0 16px;height:46px;font-size:14px}
.btn.danger{color:#fff;background:linear-gradient(135deg,#ef4444,#f97316);box-shadow:0 10px 22px -12px rgba(239,68,68,.9)}

/* ---------- 答题卡 ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:none}
.sheet-wrap.show{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(15,23,42,.5);animation:fade .2s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:76vh;overflow:auto;
  animation:up .26s cubic-bezier(.2,.8,.3,1);box-shadow:0 -12px 40px -20px rgba(0,0,0,.5)
}
.sheet-handle{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:700}
.sheet .sub{font-size:12px;color:var(--ink2);margin-bottom:12px}
.numpad{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:6px}
@media(min-width:480px){.numpad{grid-template-columns:repeat(8,1fr)}}
.np{
  height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center
}
.np.done{background:rgba(37,99,235,.1);border-color:rgba(37,99,235,.3);color:#2563eb}
.np.cur{background:linear-gradient(135deg,#2563eb,#06b6d4);border-color:transparent;color:#fff}
@media (prefers-color-scheme:dark){.np.done{background:rgba(96,165,250,.16);color:#93c5fd}}

/* ---------- 结果 ---------- */
.result{text-align:center;padding:6px 0 0}
.ringwrap{position:relative;width:168px;height:168px;margin:6px auto 4px}
.ringwrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:rgba(148,163,184,.22);fill:none;stroke-width:11}
.ring-fg{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.3,.9,.3,1)}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtext b{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ringtext span{font-size:12px;color:var(--ink2);margin-top:5px}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;margin-top:4px}
.verdict.pass{color:#0e9f6e;background:rgba(18,183,106,.12)}
.verdict.fail{color:#e5484d;background:rgba(240,68,56,.12)}
.statrow{display:flex;gap:10px;margin:16px 0 4px}
.statrow > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.statrow b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.statrow span{font-size:11px;color:var(--ink2)}
.statrow .okc b{color:#0e9f6e}
.statrow .badc b{color:#e5484d}

/* ---------- 解析列表 ---------- */
.review{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.rhead{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;width:100%;text-align:left}
.rno{flex:none;width:22px;height:22px;border-radius:7px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;background:rgba(148,163,184,.16);color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.ritem.wrong .rno{background:rgba(240,68,56,.14);color:#e5484d}
.ritem.right .rno{background:rgba(18,183,106,.14);color:#0e9f6e}
.rq{font-size:14px;line-height:1.6;font-weight:600;word-break:break-word}
.rbody{padding:0 14px 14px;display:none}
.ritem.open .rbody{display:block}
.ropt{display:flex;gap:8px;font-size:13.5px;line-height:1.6;padding:6px 0;color:var(--ink2);border-top:1px dashed var(--line)}
.ropt .rk{flex:none;font-weight:700;width:16px}
.ropt.right-ans{color:#0e9f6e;font-weight:600}
.ropt.my-wrong{color:#e5484d;text-decoration:line-through;text-decoration-thickness:1px}
.rimeta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.rimeta .a{color:#0e9f6e;font-weight:700}
.rimeta .b{color:#e5484d;font-weight:700}
.tip{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- 速查 ---------- */
.searchbar{display:flex;gap:10px;margin-bottom:12px}
.searchbar input{
  flex:1;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);
  padding:0 14px;color:var(--ink);outline:none;box-shadow:var(--shadow-sm);font-size:14.5px
}
.searchbar input::placeholder{color:var(--ink3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);display:flex;align-items:center}
.chip.on{background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;border-color:transparent;box-shadow:0 6px 16px -10px rgba(37,99,235,.9)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-size:13px;color:var(--ink2)}
.pager button{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}

/* ---------- 空状态 ---------- */
.empty{text-align:center;padding:52px 20px;color:var(--ink2)}
.empty .big{font-size:40px;line-height:1;margin-bottom:12px;opacity:.6}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.empty p{margin:0;font-size:13px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:rgba(15,23,42,.94);color:#fff;padding:10px 18px;border-radius:13px;font-size:13.5px;font-weight:500;
  opacity:0;transition:.24s;pointer-events:none;z-index:60;max-width:80vw;text-align:center;backdrop-filter:blur(8px)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s cubic-bezier(.2,.8,.3,1) both}

</style>
</head>
<body>
<div class="app" id="app"><div id="view"></div></div>
<div class="sheet-wrap" id="sheet"><div class="sheet-mask" data-act="close-sheet"></div><div class="sheet" id="sheetbody"></div></div>

      if (!st.paper) return stopTimer();
      st.paper.left--;
      paintTimer();
      if (st.paper.left <= 0) { stopTimer(); toast('考试时间到，自动交卷'); doSubmit(); }
    }, 1000);
  }

  /* ---------------- 判分 ---------------- */
  function scoreOf(paper) {
    var right = 0, wrong = 0, blank = 0, details = [];
    paper.items.forEach(function (it, i) {
      var q = BANK[it.qid];
      var ans = it.v.a.slice().sort(function (a, b) { return a - b; });
      var sel = it.sel.slice().sort(function (a, b) { return a - b; });
      var ok = sel.length === ans.length && sel.every(function (x, k) { return x === ans[k]; });
      if (!sel.length) blank++;
      else if (ok) right++; else wrong++;
      details.push({ i: i, qid: it.qid, sel: it.sel.slice(), ok: ok, blank: !sel.length, t: q.t });
    });
    var total = paper.items.length;
    var score = Math.round((right / total) * 100);
    return { right: right, wrong: wrong, blank: blank, score: score, total: total, details: details, pass: score >= paper.cfg.pass };
  }

  function doSubmit() {
    stopTimer();
    var r = scoreOf(st.paper);
    r.paper = st.paper;
    r.cfg = st.paper.cfg;
    r.used = st.paper.cfg.min * 60 - Math.max(0, st.paper.left);
    r.details.forEach(function (d) { if (!d.ok) wrongAdd(d.qid); else wrongDel(d.qid); });
    st.result = r;
    st.view = 'result';
    render();
    window.scrollTo(0, 0);
  }

    return a.length === b.length && a.every(function (x, i) { return x === b[i]; });
  }

  /* ---------------- 题库速查 ---------------- */
  function match(q, kw, type) {
    if (type >= 0 && q.t !== type) return false;
    if (!kw) return true;
    kw = kw.toLowerCase();
    if (q.q.toLowerCase().indexOf(kw) >= 0) return true;
    var os = optsOf(q);
    for (var i = 0; i < os.length; i++) if (os[i].toLowerCase().indexOf(kw) >= 0) return true;
    return false;
  }

  function browseListHTML() {
    var b = st.browse;
    var list = BANK.filter(function (q) { return match(q, b.q.trim(), b.type); });
    var per = 20, pages = Math.max(1, Math.ceil(list.length / per));
    if (b.page >= pages) b.page = pages - 1;
    var slice = list.slice(b.page * per, b.page * per + per);
    var head = '<div class="sub" style="font-size:12px;color:var(--ink2);margin-bottom:10px">共 ' + list.length + ' 题 · 第 ' + (b.page + 1) + '/' + pages + ' 页</div>';

    }

      var no = b.page * per + k + 1;
      var os = optsOf(q);
      var v = q.t === 2 ? { o: TN, a: q.a } : { o: os, a: q.a };
      return '<div class="ritem">' +
        '<button class="rhead" data-act="toggle-browse" data-v="' + q.id + '">' +

          '<span class="rq">' + esc(q.q) + '</span>' +

        }).join('') +
        '<div class="rimeta"><span class="a">答案 ' + ansText(q.t, v.a) + '</span><span style="color:var(--ink3)">' + (q.t === 1 ? '多选题' : q.t === 2 ? '判断题' : '单选题') + '</span></div>' +
        '</div>' +
      '</div>';
    }).join('');
    return head + '<div class="review" id="browseList">' + items + '</div>' +

        '<button data-act="b-prev"' + (b.page === 0 ? ' disabled' : '') + '>上一页</button>' +

    var b = st.browse;
    return topbarHTML(true) +
      '<div class="searchbar"><input id="qkw" type="search" placeholder="搜索题干或选项关键词" value="' + esc(b.q) + '"></div>' +
      '<div class="chips">' +
        [['全部', -1], ['单选题', 0], ['多选题', 1], ['判断题', 2]].map(function (x) {
          return '<button class="chip' + (b.type === x[1] ? ' on' : '') + '" data-act="b-type" data-v="' + x[1] + '">' + x[0] + '</button>';
        }).join('') +
      '</div>' +
      '<div id="browseBody">' + browseListHTML() + '</div>';
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var app = $('#app'), view = $('#view');
    var html = '';
    if (st.view === 'home') html = vHome();
    else if (st.view === 'exam') html = vExam();
    else if (st.view === 'result') html = vResult();
    else if (st.view === 'practice') html = vPractice();
    else if (st.view === 'wrong') html = vWrong();
    else if (st.view === 'browse') html = vBrowse();
    view.innerHTML = html;
    var hasBar = st.view === 'exam' || st.view === 'result' || st.view === 'practice' || st.view === 'wrong';
    app.classList.toggle('has-bar', hasBar);
    if (st.view === 'exam') paintExam();
    if (st.view === 'result') {
      var fg = $('#ringfg');
      var sc = st.result ? st.result.score : 0;
      if (fg) setTimeout(function () {
        var now = document.getElementById('ringfg');
        if (now) now.style.strokeDashoffset = (2 * Math.PI * 52 * (1 - sc / 100)).toFixed(1);
      }, 80);
    }
    if (st.view === 'browse') {
      var inp = $('#qkw');
      if (inp) inp.addEventListener('input', function () {
        st.browse.q = inp.value; st.browse.page = 0;
        $('#browseBody').innerHTML = browseListHTML();
      });
    }
  }

  /* ---------------- 弹层 ---------------- */
  function openSheet(html) {
    var w = $('#sheet');
    $('#sheetbody').innerHTML = html;
    w.classList.add('show');
  }
  function closeSheet() { $('#sheet').classList.remove('show'); }

  var modalOk = null;
  function openModal(opt) {
    $('#modalbody').innerHTML = '<div class="sheet-handle"></div>' +
      '<h3>' + esc(opt.title) + '</h3>' +
      '<div class="sub">' + esc(opt.desc || '') + '</div>' +
      '<div style="display:flex;gap:10px;margin-top:6px">' +
        '<button class="btn ghost" data-act="close-modal">' + esc(opt.cancel || '取消') + '</button>' +
        '<button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-act="modal-ok">' + esc(opt.ok || '确定') + '</button>' +
      '</div>';
    modalOk = opt.onOk || null;
    $('#modal').classList.add('show');
  }
  function closeModal() { $('#modal').classList.remove('show'); modalOk = null; }

  /* ---------------- 交互 ---------------- */
  function goExam(i) {
    st.idx = Math.max(0, Math.min(st.paper.items.length - 1, i));
    render();
    window.scrollTo(0, 0);
  }

  function pickExam(i) {
    var it = st.paper.items[st.idx];
    var q = BANK[it.qid];
    if (q.t === 1) {
      var k = it.sel.indexOf(i);
      if (k >= 0) it.sel.splice(k, 1); else it.sel.push(i);
    } else {
      it.sel = [i];
    }
    paintOptions();
  }

  function pickPractice(i) {
    var pr = st.practice;
    if (pr.revealed[pr.idx]) return;
    var q = BANK[pr.ids[pr.idx]];
    var cur = pr.sel[pr.idx] || [];
    if (q.t === 1) {
      var k = cur.indexOf(i);
      if (k >= 0) cur.splice(k, 1); else cur.push(i);
    } else {
      cur = [i];
    }
    pr.sel[pr.idx] = cur;
    // 单选/判断立刻判定，多选等点“查看答案”
    if (q.t !== 1) {
      pr.revealed[pr.idx] = true;
      if (isCorrect(cur, pr.views[pr.idx].a)) wrongDel(q.id); else wrongAdd(q.id);
      render();
    } else {
      var nodes = document.querySelectorAll('#opts .opt');
      for (var n = 0; n < nodes.length; n++) {
        nodes[n].classList.toggle('on', cur.indexOf(+nodes[n].getAttribute('data-v')) >= 0);
      }
    }
  }

  function practiceReveal() {
    var pr = st.practice;
    var q = BANK[pr.ids[pr.idx]];
    var sel = pr.sel[pr.idx] || [];
    pr.revealed[pr.idx] = true;
    if (isCorrect(sel, pr.views[pr.idx].a)) wrongDel(q.id); else wrongAdd(q.id);
    render();
    window.scrollTo(0, 0);
  }

  function practiceNext() {
    var pr = st.practice;
    if (pr.idx >= pr.ids.length - 1) { st.view = 'home'; render(); window.scrollTo(0, 0); return; }
    pr.idx++;
    render();
    window.scrollTo(0, 0);
  }

  function clearExamState() {
    stopTimer();
    st.paper = null;
    st.result = null;
  }

  function askSubmit() {
    var p = st.paper;
    var done = p.items.filter(function (x) { return x.sel.length; }).length;
    var left = p.items.length - done;
    openModal({
      title: '确认交卷？',
      desc: left > 0 ? '还有 ' + left + ' 题未作答，交卷后不可修改' : '全部题目已作答，交卷后不可修改',
      ok: '交卷',
      cancel: '再检查下',
      danger: left > 0,
      onOk: function () { closeModal(); closeSheet(); doSubmit(); }
    });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var v = el.getAttribute('data-v');

    switch (act) {
      case 'home':
        clearExamState();
        st.view = 'home'; render(); window.scrollTo(0, 0); break;

      case 'start': startExam(v); break;

      case 'practice-all':
        openPractice(BANK.map(function (q) { return q.id; }), '顺序练习', 0); break;

      case 'practice-wrong': {
        var ids = Object.keys(wrongDB()).map(Number);
        if (!ids.length) { toast('错题本是空的'); break; }
        openPractice(ids, '错题练习', 0); break;
      }

      case 'open-wrong': st.view = 'wrong'; render(); window.scrollTo(0, 0); break;
      case 'open-browse': st.view = 'browse'; render(); window.scrollTo(0, 0); break;

      case 'wrong-open': {
        var db = wrongDB();
        var ids2 = Object.keys(db).map(Number).sort(function (a, b) { return db[b] - db[a]; });
        openPractice(ids2, '错题练习', Math.max(0, ids2.indexOf(+v))); break;
      }

      case 'clear-wrong':
        openModal({
          title: '清空错题本？', desc: '已收录的错题记录会被清除', ok: '清空', danger: true,
          onOk: function () { closeModal(); store(WRONG_KEY, {}); st.view = 'wrong'; render(); toast('已清空'); }
        }); break;

      case 'pick':
        if (st.view === 'exam') pickExam(+v);
        else if (st.view === 'practice') pickPractice(+v);
        break;

      case 'prev': if (st.idx > 0) goExam(st.idx - 1); break;
      case 'next': goExam(st.idx + 1); break;
      case 'jump': closeSheet(); goExam(+v); break;

      case 'open-card': openSheet(cardSheetHTML()); break;
      case 'close-sheet': closeSheet(); break;
      case 'ask-submit': askSubmit(); break;
      case 'close-modal': closeModal(); break;
      case 'modal-ok': if (modalOk) modalOk(); break;

      case 'exit-exam':
        openModal({
          title: '退出考试？', desc: '当前答题进度将不会保存', ok: '退出', danger: true,
          onOk: function () { closeModal(); clearExamState(); st.view = 'home'; render(); window.scrollTo(0, 0); }
        }); break;

      case 'scroll-review': {
        var a = $('#reviewAnchor');
        if (a) a.scrollIntoView({ behavior: 'smooth' });
        break;
      }

      case 'retry': {
        var kind = st.result && st.result.cfg ? st.result.cfg.key : 'standard';
        clearExamState(); startExam(kind); break;
      }

      case 'toggle-review': {
        var it = document.querySelector('.ritem[data-ri="' + v + '"]');
        if (it) it.classList.toggle('open');
        break;
      }
      case 'toggle-browse': {
        var bt = el.closest('.ritem');
        if (bt) bt.classList.toggle('open');
        break;
      }
      case 'p-prev': {
        var pr = st.practice;
        if (pr.idx > 0) { pr.idx--; render(); window.scrollTo(0, 0); }
        break;
      }
      case 'p-next': practiceNext(); break;
      case 'p-reveal': practiceReveal(); break;

      case 'b-type':
        st.browse.type = +v; st.browse.page = 0; render(); break;
      case 'b-prev':
        if (st.browse.page > 0) { st.browse.page--; render(); window.scrollTo(0, 0); }
        break;
      case 'b-next':
        st.browse.page++; render(); window.scrollTo(0, 0); break;

      case 'open-sheet-card':
        openSheet('<div class="sheet-handle"></div><h3>关于题库</h3>' +
          '<div class="sub">题库整理自《温州保安考题》，共 ' + BANK.length + ' 道题，适用于浙江省保安员从业资格考试复习。</div>' +
          '<div style="font-size:13px;color:var(--ink2);line-height:1.9;margin-bottom:14px">' +
            '· 单选题 ' + BY[0].length + ' 道<br>· 多选题 ' + BY[1].length + ' 道<br>· 判断题 ' + BY[2].length + ' 道<br>' +
            '· 满分 100 分，60 分合格' +
          '</div>' +
          '<button class="btn primary" data-act="close-sheet">知道了</button>');
        break;
    }
  });

  // 首次渲染
  render();
  window.addEventListener('beforeunload', stopTimer);
})();

</script>
</body>
</html>
